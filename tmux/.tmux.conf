# ~/.tmux.conf — managed by ~/dotfiles (stow package: tmux)
# Reload inside tmux: prefix + r

# ---------- Core behaviour ----------
set -s escape-time 0              # no lag after Esc (vim/neovim). Use 10 if you see garbage chars over slow SSH
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g mouse on
setw -g aggressive-resize on

# ---------- Colours / terminal ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # adjust pattern to outer $TERM

# ---------- Clipboard (OSC 52, works over SSH) ----------
set -s set-clipboard on

# ---------- Numbering ----------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------- Prefix (OPEN DECISION — default C-b kept) ----------
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix            # press C-a twice to send a literal C-a

# ---------- Key bindings ----------
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---------- Machine-local overrides (untracked; silently skipped if missing) ----------
source-file -q ~/.tmux.local.conf

# ---------- Plugins (TPM) ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # prefix+C-s save, prefix+C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Auto-install TPM + plugins on a fresh machine (from TPM's official docs)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep this line LAST
run '~/.tmux/plugins/tpm/tpm'
